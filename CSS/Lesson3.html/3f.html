
<!DOCTYPE html>
<html>
<head>
    <title>Nike Black Running Shoes</title>

    <style>
        .product {
            width: 550px;
            padding: 15px;
            background-color: white;
            font-family: Georgia, serif;
        }

        .back {
            color: rgb(0, 113, 133);
            font-size: 25px;
        }

        .title {
            color: rgb(0, 0, 0);
            font-size: 40px;
            font-weight: bold;
        }

        .price {
            color: rgb(0, 118, 0);
            font-size: 25px;
            font-weight: bold;
        }

        .delivery {
            color: rgb(0, 0, 0);
            font-size: 25px;
        }

        .cart {
            background-color: rgb(255, 39, 20);
            color: black;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            padding: 12px 40px;
            cursor: pointer;
        }

        .buy {
            background-color: rgb(255, 164, 28);
            color: black;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            padding: 12px 40px;
            margin-left: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="product">

        <a href="#" class="back">Back to Amazon</a>

        <h1 class="title">Nike Black Running Shoes</h1>

        <p class="price">$39 - in stock.</p>

        <p class="delivery">Free delivery tomorrow.</p>

        <button class="cart">Add to Cart</button>

        <button class="buy">Buy now</button>

    </div>

</body>
</html>
