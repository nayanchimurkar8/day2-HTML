<!DOCTYPE html>
<html>
<head>
  <title>4h - Pagination</title>

  <style>
    .pagination {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .pagination button {
      font-size: 24px;
      padding: 12px 18px;
      border: 2px solid rgb(235, 110, 110);
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination a {
      font-size: 24px;
      color: rgb(0, 128, 51);
    }
  </style>
</head>

<body>

  <div class="pagination">

    <button>Back</button>

    <a href="#">1</a>
    <a href="#">2</a>
    <a href="#">3</a>
    <a href="#">4</a>
    <a href="#">5</a>

    <button>Next</button>

  </div>

</body>
</html>
