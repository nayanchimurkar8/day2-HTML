<!DOCTYPE html>
<html>
<head>
  <title>Buttons</title>

  <style>
    .subscribe-button {
      background-color: rgb(200, 0, 0);
      color: white;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      margin-right: 8px;
    }

    .join-button {
      background-color: white;
      color: rgb(55, 41, 211);
      border: 1px solid rgb(41, 118, 211);
      padding: 9px 16px;
      cursor: pointer;
      margin-right: 8px;
    }

    .tweet-button {
      background-color: rgb(29, 85, 240);
      color: white;
      border: none;
      border-radius: 20px;

      
      padding: 10px 20px;

      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button class="subscribe-button">
    SUBSCRIBE
  </button>

  <button class="join-button">
    JOIN
  </button>

  <button class="tweet-button">
    Tweet
  </button>

</body>
</html>
